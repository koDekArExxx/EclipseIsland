name: Publish EclipseIsland
run-name: EclipseIsland v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, for example 1.0.2'
        required: true
        default: '1.0.8'
      notes:
        description: 'Release notes'
        required: false
        default: ''
      replace_existing:
        description: 'Replace the existing release of this version (same-version installs need reinstall)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: eclipse-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          node -e 'if(!/^(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})$/.test(process.env.RELEASE_VERSION))process.exit(1)'
          gh release view "v$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            if ('${{ inputs.replace_existing }}' -ne 'true') { throw 'This release already exists; select replace_existing for an intentional rebuild' }
            $isDraft=gh release view "v$env:RELEASE_VERSION" --json isDraft --jq .isDraft
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing release' }
            if ($isDraft -ne 'true') {
              $latestTag=gh release view --json tagName --jq .tagName
              if ($LASTEXITCODE -ne 0 -or $latestTag -ne "v$env:RELEASE_VERSION") { throw 'Only the latest release may be replaced' }
            }
          }
          $global:LASTEXITCODE=0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Test Telegram bot
        run: python -m unittest discover -s telegram-bot -v
      - run: npm run build:media
      - run: npm run build:online
      - name: Test Windows launcher
        shell: pwsh
        run: ./distribution/Test-Launcher.ps1
      - name: Save installer UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-ui-check
          path: release-online/ui-check/*.png
          if-no-files-found: ignore
      - name: Publish complete release
        shell: pwsh
        run: |
          node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")); fs.writeFileSync("release-online/notes.txt",e.inputs.notes||"Обновление EclipseIsland");'
          $releaseTitle="EclipseIsland $env:RELEASE_VERSION"
          if ($env:RELEASE_VERSION -eq "1.0.1") { $releaseTitle+=" Fix" }
          $tag="v$env:RELEASE_VERSION"
          gh release view $tag *> $null
          $exists=$LASTEXITCODE -eq 0
          if ($exists) {
            if ('${{ inputs.replace_existing }}' -ne 'true') { throw 'Replacement was not authorized' }
            # All builds and tests passed before modifying the published release.
            # Keep incomplete asset replacement off the public latest feed.
            gh release edit $tag --draft=true
            if ($LASTEXITCODE -ne 0) { throw 'Cannot unpublish the old release for replacement' }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { throw 'Cannot update release tag; draft remains unpublished' }
            gh release edit $tag --title "$releaseTitle" --notes-file release-online/notes.txt
          } else {
            gh release create $tag --draft --target "$env:GITHUB_SHA" --title "$releaseTitle" --notes-file release-online/notes.txt
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare draft release' }
          gh release upload "v$env:RELEASE_VERSION" release-online/EclipseIsland-Setup.exe release-online/EclipseIsland-app.zip release-online/update-manifest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished' }
          gh release edit "v$env:RELEASE_VERSION" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release' }
