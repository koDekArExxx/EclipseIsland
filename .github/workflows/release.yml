name: Publish EclipseIsland
run-name: EclipseIsland v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, for example 1.0.2'
        required: true
        default: '1.0.4'
      notes:
        description: 'Release notes'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: eclipse-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          node -e 'if(!/^(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})$/.test(process.env.RELEASE_VERSION))process.exit(1)'
          gh release view "v$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release tag already exists' }
          $global:LASTEXITCODE=0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Test Telegram bot
        run: python -m unittest discover -s telegram-bot -v
      - run: npm run build:media
      - run: npm run build:online
      - name: Test Windows launcher
        shell: pwsh
        run: ./distribution/Test-Launcher.ps1
      - name: Save installer UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-ui-check
          path: release-online/ui-check/*.png
          if-no-files-found: ignore
      - name: Publish complete release atomically
        shell: pwsh
        run: |
          node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")); fs.writeFileSync("release-online/notes.txt",e.inputs.notes||"Обновление EclipseIsland");'
          $releaseTitle="EclipseIsland $env:RELEASE_VERSION"
          if ($env:RELEASE_VERSION -eq "1.0.1") { $releaseTitle+=" Fix" }
          gh release create "v$env:RELEASE_VERSION" --draft --target "$env:GITHUB_SHA" --title "$releaseTitle" --notes-file release-online/notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release' }
          gh release upload "v$env:RELEASE_VERSION" release-online/EclipseIsland-Setup.exe release-online/EclipseIsland-app.zip release-online/update-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished' }
          gh release edit "v$env:RELEASE_VERSION" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release' }
